apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop-v2
  labels:
    app: juice-shop
    version: v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: juice-shop
      version: v2
  template:
    metadata:
      labels:
        app: juice-shop
        version: v2
    spec:
      containers:
        - name: juice-shop
          image: bkimminich/juice-shop:v20.0.0
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: juice-shop-v2
spec:
  selector:
    app: juice-shop
    version: v2
  ports:
    - port: 80
      targetPort: 3000
