apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-copilot-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: ai-copilot-secrets
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: pdp-eks/ai-copilot
        property: ANTHROPIC_API_KEY
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: pdp-eks/slack-webhook
        property: url
