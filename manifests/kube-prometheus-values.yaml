alertmanager:
  config:
    route:
      receiver: 'slack-notifications'
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 3h
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: 'null'
      - name: 'slack-notifications'
        slack_configs:
          - api_url: 'REDACTED_USE_SECRET'
            channel: '#all-pdp-demo'
            send_resolved: true
            title: '{{ .CommonAnnotations.summary }}'
            text: '{{ .CommonAnnotations.description }}'
grafana:
  adminPassword: pdp-admin-2026
