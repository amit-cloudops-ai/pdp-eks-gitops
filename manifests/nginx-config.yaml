apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-sidecar-config
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 80;
        location /nginx_status {
          stub_status on;
          allow 127.0.0.1;
          deny all;
        }
        location / {
          proxy_pass http://localhost:3000;
        }
      }
    }
