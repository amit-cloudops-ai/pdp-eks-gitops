apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-copilot
  labels:
    app: ai-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-copilot
  template:
    metadata:
      labels:
        app: ai-copilot
    spec:
      containers:
        - name: ai-copilot
          # Replace with your ECR image URI after building & pushing (see README)
          image: REPLACE_WITH_YOUR_ECR_IMAGE_URI:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: ai-copilot-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-copilot
spec:
  selector:
    app: ai-copilot
  ports:
    - port: 8080
      targetPort: 8080
